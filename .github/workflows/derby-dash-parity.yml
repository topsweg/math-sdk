name: Derby Dash parity simulation
on:
  workflow_dispatch:
  push:
    branches: [derby-dash-v1]
    paths:
      - "games/derby_dash_v1/parity_sim.py"
      - ".github/workflows/derby-dash-parity.yml"
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK dependencies
        run: pip install -r requirements.txt
      - name: Run 1M paid / 100k buy parity simulation
        working-directory: games/derby_dash_v1
        run: PYTHONPATH=../.. python parity_sim.py | tee parity-results.txt
      - name: Upload parity results
        uses: actions/upload-artifact@v4
        with:
          name: derby-dash-parity-results
          path: games/derby_dash_v1/parity-results.txt
